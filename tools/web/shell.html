<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* 工具栏独占空间，避免全屏入口盖住游戏 HUD。 */
#web-toolbar {
	position: absolute;
	inset: 0 0 auto;
	height: 52px;
	box-sizing: border-box;
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 6px 16px;
	background: #171320;
	color: #e8dfcf;
	font: 15px system-ui, sans-serif;
	border-bottom: 1px solid #504636;
}
#fullscreen-button {
	margin-left: auto;
	flex-shrink: 0;
	padding: 7px 18px;
	border: 1px solid #e3c37c;
	border-radius: 5px;
	background: #e3c37c;
	color: #211b26;
	font: 600 16px system-ui, sans-serif;
	cursor: pointer;
}
#fullscreen-button:hover { background: #f4d797; }
#fullscreen-button:focus-visible { outline: 2px solid white; outline-offset: 2px; }
#fullscreen-button:disabled { opacity: 0.55; cursor: default; }
#fullscreen-notice { font-size: 13px; }
#game-area { position: absolute; inset: 52px 0 0; }

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<header id="web-toolbar">
			<span>冥河，冥河！</span>
			<span id="fullscreen-notice" role="status"></span>
			<button id="fullscreen-button" type="button" title="进入全屏，按 Esc 退出" disabled>⛶ 全屏游玩</button>
		</header>
		<main id="game-area">
		<canvas id="canvas">
			当前浏览器不支持游戏画布。
		</canvas>

		<noscript>
			请启用 JavaScript 后运行游戏。
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		</main>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
const canvas = document.getElementById('canvas');
const gameArea = document.getElementById('game-area');
const fullscreenButton = document.getElementById('fullscreen-button');
const fullscreenNotice = document.getElementById('fullscreen-notice');

// 网页提供实际像素尺寸；游戏继续用 1920×1080 的 KEEP 模式等比居中。
function fitCanvas() {
	const fullscreen = document.fullscreenElement === canvas;
	const width = fullscreen ? window.innerWidth : gameArea.clientWidth;
	const height = fullscreen ? window.innerHeight : gameArea.clientHeight;
	const ratio = window.devicePixelRatio || 1;
	canvas.style.width = `${width}px`;
	canvas.style.height = `${height}px`;
	const pixelWidth = Math.round(width * ratio);
	const pixelHeight = Math.round(height * ratio);
	if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
	if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
}
new ResizeObserver(fitCanvas).observe(gameArea);
window.addEventListener('resize', fitCanvas);
document.addEventListener('fullscreenchange', () => {
	fitCanvas();
	canvas.focus({ preventScroll: true });
});
document.addEventListener('keydown', (event) => {
	if (event.key === 'Escape' && document.fullscreenElement === canvas) {
		// 退出全屏的这次按键不再同时触发游戏菜单的返回操作。
		event.preventDefault();
		event.stopImmediatePropagation();
		document.exitFullscreen();
	}
}, true);
fullscreenButton.addEventListener('click', async () => {
	fullscreenNotice.textContent = '';
	try {
		// 直接在用户点击时请求画布全屏，浏览器会隐藏画布之外的工具栏。
		await canvas.requestFullscreen();
	} catch (error) {
		fullscreenNotice.textContent = '未能进入全屏，请检查浏览器权限。';
	}
});
fitCanvas();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('游戏启动失败，请刷新页面重试。');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('当前浏览器缺少游戏运行所需功能：\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'canvasResizePolicy': 0,
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			fitCanvas();
			fullscreenButton.disabled = !document.fullscreenEnabled;
			if (!document.fullscreenEnabled) fullscreenNotice.textContent = '当前浏览器不支持全屏。';
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
